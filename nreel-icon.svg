<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">NReel icon</title>
  <desc id="desc">NReel icon mark using a white N and red film strip.</desc>
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1d"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="whiteSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#d8d8d8"/>
      <stop offset="0.75" stop-color="#ffffff"/>
