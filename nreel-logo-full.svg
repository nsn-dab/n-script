<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 361 135" role="img" aria-labelledby="title desc">
  <title id="title">NReel full logo</title>
  <desc id="desc">NReel full logo with outlined N, red film strip, outlined Reel wordmark, and Watch Analyze Understand tagline.</desc>
  <defs>
    <linearGradient id="nFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.56" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="reelStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#d8d8d8"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="filmRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e00012"/>
      <stop offset="1" stop-color="#a8000e"/>
    </linearGradient>
  </defs>

  <rect width="361" height="135" fill="none"/>

  <g transform="translate(1 0)">
    <path d="M0 95V1h16l79 78V1h14v107H94L15 30v65Z" fill="url(#nFill)" stroke="#ffffff" stroke-width="0.9"/>
    <path d="M16 29l79 78" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.85"/>
    <path d="M77 0h31v108H77Z" fill="url(#filmRed)"/>
    <g fill="#ffffff">
      <rect x="91" y="8" width="10" height="8"/>
      <rect x="91" y="27" width="10" height="8"/>
      <rect x="91" y="46" width="10" height="8"/>
      <rect x="91" y="65" width="10" height="8"/>
      <rect x="91" y="84" width="10" height="8"/>
    </g>
  </g>

  <text x="148" y="95"
    fill="none"
    stroke="url(#reelStroke)"
    stroke-width="0.9"
    font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif"
    font-size="78"
    font-weight="300"
    letter-spacing="8">Reel</text>

  <g font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="7">
    <text x="0" y="131" fill="#ffffff">WATCH</text>
    <text x="103" y="131" fill="#a8000e" font-weight="700">ANALYZE</text>
    <text x="223" y="131" fill="#ffffff">UNDERSTAND</text>
  </g>
</svg>
