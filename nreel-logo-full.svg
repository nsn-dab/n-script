<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 362 135" role="img" aria-labelledby="title desc">
  <title id="title">NReel full logo</title>
  <desc id="desc">NReel full logo with an outlined N, red film strip, outlined Reel text, and Watch Analyze Understand tagline.</desc>
  <defs>
    <linearGradient id="edgeWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.56" stop-color="#f2f2f2"/>
      <stop offset="1" stop-color="#cfcfcf"/>
    </linearGradient>
    <linearGradient id="redFilm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e00012"/>
      <stop offset="1" stop-color="#a8000e"/>
    </linearGradient>
  </defs>

  <rect width="362" height="135" fill="none"/>

  <g transform="translate(1 0)">
    <path d="M0.5 95V1h16l79 78V1h14v107h-15L15 30v65Z" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <path d="M3 93V4h12l79 78V4h10v99h-10L14 25v68Z" fill="url(#edgeWhite)" opacity="0.13"/>
    <path d="M77 1h31v107H77Z" fill="url(#redFilm)"/>
    <g fill="#ffffff">
      <rect x="91" y="9" width="10" height="8"/>
      <rect x="91" y="27" width="10" height="8"/>
      <rect x="91" y="45" width="10" height="8"/>
      <rect x="91" y="63" width="10" height="8"/>
      <rect x="91" y="81" width="10" height="8"/>
    </g>
  </g>

  <text x="147" y="95"
    fill="none"
    stroke="#ffffff"
    stroke-width="1"
    font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif"
    font-size="78"
    font-weight="300"
    letter-spacing="8">Reel</text>

  <text x="0" y="131"
    fill="#ffffff"
    font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif"
    font-size="13"
    font-weight="500"
    letter-spacing="7">WATCH</text>
  <text x="103" y="131"
    fill="#a8000e"
    font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif"
    font-size="13"
    font-weight="700"
    letter-spacing="7">ANALYZE</text>
  <text x="223" y="131"
    fill="#ffffff"
    font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif"
    font-size="13"
    font-weight="500"
    letter-spacing="7">UNDERSTAND</text>
</svg>
